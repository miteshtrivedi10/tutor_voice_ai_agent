[project]
name = "voice_agent"
version = "0.1.0"
description = "A voice-based tutoring agent built with LiveKit and Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "pydantic>=2.11.7",
    "livekit[server,voice-agent-pipeline,voiceagentpipeline]>=1.0.12",
    "livekit-agents[deepgram,groq,sarvam,silero,transcription,turn-detector]>=1.2.5",
    "livekit-plugins-noise-cancellation>=0.2.5",
    "loguru>=0.7.3",
    "qa-metrics>=0.2.42",
    "supabase>=2.18.1",
    "opentelemetry-distro>=0.57b0",
    "opentelemetry-exporter-otlp>=1.36.0",
    "opentelemetry-exporter-otlp-proto-http>=1.36.0",
    "pandas>=2.0.0",
    "nltk>=3.9.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"
