[project]
name = "mcp-server"
version = "0.1.0"
description = "MCP Server for Voice Tutor Agent with caching and Supabase integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.12.3",
    "mcp>=1.14.0",
    "theine>=2.0.0",
    "supabase>=2.18.1",
    "fastapi>=0.116.1",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "pytest>=8.4.2",
    "sentence-transformers>=5.1.0",
    "loguru>=0.7.3",
]
